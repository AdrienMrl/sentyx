<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Progress dashboard for the Tesla contact-detection research program">
  <title>Research observatory · Sentyx</title>
  <style>
    :root{color-scheme:dark;--ink:#eaf0f4;--muted:#8795a1;--dim:#586774;--bg:#071015;--panel:#0d181f;--panel2:#111f27;--line:#21313b;--cyan:#75e7df;--amber:#ffca70;--red:#ff7b72;--green:#86d493;--violet:#b8a6ff;--radius:14px}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 18% -10%,#15313a 0,transparent 35rem),var(--bg);min-height:100vh}
    button,input,select{font:inherit}button{color:inherit}.shell{max-width:1440px;margin:auto;padding:24px 28px 64px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border:1px solid #42616c;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 5px #0b1b22}.mark:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}h1{font:600 1rem/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;margin:0}.brand small{color:var(--muted);display:block;font-size:.75rem;margin-top:4px}.sync{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.8rem}.sync button{border:1px solid var(--line);background:#0c171d;border-radius:999px;padding:7px 12px;cursor:pointer}.sync button:hover{border-color:#4a6975}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.main{min-width:0}.side{min-width:0}.objective{position:relative;overflow:hidden;border:1px solid #29404b;border-radius:20px;background:linear-gradient(135deg,rgba(18,38,47,.96),rgba(10,23,29,.98));padding:26px 28px 25px;margin-bottom:18px}.objective:after{content:"";position:absolute;right:-40px;top:-100px;width:320px;height:320px;border:1px solid rgba(117,231,223,.11);border-radius:50%;box-shadow:0 0 0 45px rgba(117,231,223,.025),0 0 0 90px rgba(117,231,223,.018)}.eyebrow{font:600 .72rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);margin-bottom:13px}.objective h2{position:relative;z-index:1;font-size:clamp(1.3rem,2.3vw,2rem);line-height:1.3;max-width:880px;margin:0;font-weight:540;letter-spacing:-.025em}.objective-foot{position:relative;z-index:1;display:flex;gap:12px;align-items:center;margin-top:20px;color:var(--muted);font-size:.82rem}.status{display:inline-flex;align-items:center;gap:7px;color:var(--amber);border:1px solid #5b4928;background:#2a2113;border-radius:999px;padding:5px 10px;text-transform:uppercase;letter-spacing:.08em;font:600 .7rem/1 ui-monospace,SFMono-Regular,Menlo,monospace}.status:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.status.active{color:var(--green);border-color:#315239;background:#132719}.dataset-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.dataset{border:1px solid var(--line);background:rgba(13,24,31,.88);border-radius:var(--radius);overflow:hidden}.dataset-head{display:flex;justify-content:space-between;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:#0a151b}.dataset-name{font:650 .74rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.13em}.dataset.synthetic .dataset-name{color:var(--violet)}.dataset.real .dataset-name{color:var(--cyan)}.dataset-date{font-size:.7rem;color:var(--muted)}.dataset-metrics{display:grid;grid-template-columns:1fr 1fr}.metric{padding:17px 18px;min-height:112px}.metric+.metric{border-left:1px solid var(--line)}.metric .label,.section-label{font:600 .7rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.metric .value{font-size:1.85rem;line-height:1.1;font-weight:620;margin:12px 0 5px;letter-spacing:-.04em}.metric .note{color:var(--muted);font-size:.75rem}.value.bad{color:var(--red)}.value.mid{color:var(--amber)}.value.good{color:var(--green)}.dataset-source{border-top:1px solid var(--line);padding:9px 17px;color:var(--muted);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel{border:1px solid var(--line);background:rgba(13,24,31,.88);border-radius:var(--radius);padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel h3{font-size:.95rem;margin:0;font-weight:600}.legend{display:flex;gap:14px;color:var(--muted);font-size:.72rem}.legend span:before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--color)}#trend{width:100%;height:205px;display:block}.chart-empty{height:205px;display:grid;place-items:center;color:var(--muted)}.timeline{list-style:none;padding:0;margin:0}.event{display:grid;grid-template-columns:92px 18px minmax(0,1fr);gap:10px}.event time{font:500 .72rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);padding-top:2px}.rail{position:relative;display:flex;justify-content:center}.rail:before{content:"";position:absolute;top:16px;bottom:-12px;width:1px;background:var(--line)}.event:last-child .rail:before{display:none}.dot{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--dim);box-shadow:0 0 0 4px var(--panel)}.event.result .dot{background:var(--cyan)}.event.focus .dot{background:var(--amber)}.event.blocker .dot{background:var(--red)}.event-body{padding-bottom:22px;min-width:0}.event-title{display:flex;align-items:start;justify-content:space-between;gap:10px}.event-title strong{font-size:.9rem;font-weight:580}.kind{font:600 .62rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 7px;white-space:nowrap}.event p{color:#aab6be;font-size:.82rem;margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font:500 .68rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:5px 7px;background:#091319;border:1px solid var(--line);border-radius:6px;color:#9eabb3}.filters{display:flex;gap:8px}.filters input,.filters select{background:#091319;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.78rem}.filters input{width:220px}.filters input:focus,.filters select:focus{outline:2px solid rgba(117,231,223,.3);border-color:var(--cyan)}.side .panel{padding:18px}.verdict{border-left:2px solid var(--amber);padding-left:14px;color:#c5cfd5;font-size:.84rem}.verdict strong{display:block;color:var(--ink);margin-bottom:6px}.review{cursor:pointer;border-top:1px solid var(--line);padding:13px 0}.review:first-of-type{border:0}.review-head{display:flex;justify-content:space-between;gap:8px}.review-title{font-size:.82rem;font-weight:580}.review-meta{font:500 .65rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}.review-body{display:none;color:#abb7bf;font-size:.78rem;margin-top:10px;max-height:360px;overflow:auto;padding-right:5px;white-space:pre-wrap}.review.open .review-body{display:block}.empty{color:var(--muted);font-size:.82rem}.error{max-width:700px;margin:80px auto;border:1px solid #663a39;background:#261617;color:#ffc0bb;padding:20px;border-radius:12px}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:18px}.side .panel{margin:0}}
    @media(max-width:680px){.shell{padding:18px 14px 40px}.topbar{align-items:flex-start}.sync span{display:none}.objective{padding:21px 19px}.dataset-grid{grid-template-columns:1fr}.metric{min-height:100px;padding:14px}.metric .value{font-size:1.55rem}.side{grid-template-columns:1fr}.event{grid-template-columns:70px 14px minmax(0,1fr)}.filters{width:100%;flex-wrap:wrap}.filters input{width:100%}.panel-head{align-items:flex-start;flex-direction:column}.legend{flex-wrap:wrap}.objective-foot{flex-wrap:wrap}}
  </style>
</head>
<body>
<main class="shell" id="app">
  <header class="topbar"><div class="brand"><div class="mark"></div><div><h1>Research observatory</h1><small>Sentyx · contact intelligence</small></div></div><div class="sync"><span id="updated">Connecting…</span><button id="refresh">Refresh</button></div></header>
  <div id="content"></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const short=s=>new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
let data,query='',kind='';
function latestMetric(keys){for(const e of data.entries)for(const k of keys)if(e.metrics&&num(e.metrics[k])!==null)return {v:num(e.metrics[k]),e,k};return null}
function latestRate(direct,numerators,denominators){for(const e of data.entries){const m=e.metrics||{};for(const k of direct){const v=num(m[k]);if(v!==null)return {v,e,k}}for(const n of numerators){const top=num(m[n]);if(top===null)continue;for(const d of denominators){const bottom=num(m[d]);if(bottom>0)return {v:top/bottom,e,k:n+'/'+d}}}}return null}
function firstNumber(m,keys){for(const k of keys){const v=num(m[k]);if(v!==null)return v}return null}
function confusion(e){const m=e.metrics||{},fp=firstNumber(m,['fp','phantom','phantoms']),fn=firstNumber(m,['fn','missed','contact_missed']),neg=firstNumber(m,['negatives','web_negatives']),pos=firstNumber(m,['positives','web_positives']);return fp!==null&&fn!==null&&neg>0&&pos>0?{e,fp,fn,neg,pos}:null}
function datasetResult(name){for(const e of data.entries){const tags=(e.tags||[]).map(x=>x.toLowerCase()),c=confusion(e);if(!c)continue;if(name==='synthetic'&&tags.includes('synthetic')&&!tags.includes('domain-gap'))return c;if(name==='real'&&tags.some(t=>['real','web','field'].includes(t)))return c}return null}
function formatRate(x){if(!x)return '—';return x.v<=1?(x.v*100).toFixed(x.v<.1?1:0)+'%':String(x.v)}
function metricClass(v,mode){if(v===null||mode==='count')return '';if(mode==='auc')return v>=.8?'good':v>=.7?'mid':'bad';return v<=.05?'good':v<=.2?'mid':'bad'}
function stripMd(s){return String(s||'').replace(/[`*_#>\[\]]/g,'').replace(/\([^)]*\)/g,'').trim()}
function metricCard(label,item,mode,note){const v=item?.v??null;const display=mode==='auc'?(v===null?'—':v.toFixed(3)):mode==='count'?String(v??'—'):formatRate(item);return `<div class="metric"><div class="label">${label}</div><div class="value ${metricClass(v,mode)}">${display}</div><div class="note">${esc(note||item?.e.title||'Not measured')}</div></div>`}
function errorCard(label,count,total){if(count===undefined)return `<div class="metric"><div class="label">${label}</div><div class="value">—</div><div class="note">Not recorded</div></div>`;const rate=count/total;return `<div class="metric"><div class="label">${label}</div><div class="value ${metricClass(rate,'rate')}">${(rate*100).toFixed(rate<.1?1:0)}%</div><div class="note">${count} / ${total} cases</div></div>`}
function datasetBlock(name,result){const label=name[0].toUpperCase()+name.slice(1);return `<section class="dataset ${name}"><div class="dataset-head"><span class="dataset-name">${label} dataset</span><span class="dataset-date">${result?short(result.e.time):'No result'}</span></div><div class="dataset-metrics">${errorCard('False positives',result?.fp,result?.neg)}${errorCard('False negatives',result?.fn,result?.pos)}</div><div class="dataset-source">${esc(result?.e.title||'No comparable FP/FN result recorded')}</div></section>`}
function sparkPoints(series,w,h){if(series.length<2)return '';const min=0,max=1;return series.map((x,i)=>`${(i/(series.length-1))*w},${h-((x.v-min)/(max-min))*h}`).join(' ')}
function renderChart(){const host=document.getElementById('chart');const pick=(key,aliases)=>data.entries.filter(e=>e.kind==='result'&&e.metrics).map(e=>{for(const k of aliases){const v=num(e.metrics[k]);if(v!==null)return {v,time:e.time,title:e.title}}}).filter(Boolean).reverse().slice(-18);const sets=[{name:'AUC',color:'#75e7df',data:pick('auc',['auc','within_web_auc','web_auc_max','model_auc'])},{name:'FPR',color:'#ff7b72',data:pick('fpr',['fpr','field_fpr'])},{name:'FNR',color:'#ffca70',data:pick('fnr',['fnr'])}];if(!sets.some(s=>s.data.length>1)){host.innerHTML='<div class="chart-empty">More comparable metrics are needed for a trend.</div>';return}const W=900,H=185,pad=18;let grid='';for(let i=0;i<=4;i++){let y=pad+(H-pad*2)*i/4;grid+=`<line x1="38" y1="${y}" x2="${W}" y2="${y}" stroke="#21313b"/><text x="0" y="${y+4}" fill="#667681" font-size="11">${Math.round((1-i/4)*100)}%</text>`}let lines=sets.map(s=>s.data.length>1?`<polyline points="${sparkPoints(s.data,W-48,H-pad*2).split(' ').map(p=>{let [x,y]=p.split(',').map(Number);return `${x+48},${y+pad}`}).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:'').join('');host.innerHTML=`<svg id="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="AUC, false-positive rate, and false-negative rate over logged results">${grid}${lines}</svg>`}
function eventHTML(e){const chips=Object.entries(e.metrics||{}).slice(0,5).map(([k,v])=>`<span class="chip">${esc(k)} ${esc(v)}</span>`).join('');return `<li class="event ${esc(e.kind)}"><time>${short(e.time)}</time><div class="rail"><span class="dot"></span></div><div class="event-body"><div class="event-title"><strong>${esc(e.title)}</strong><span class="kind">${esc(e.kind)}</span></div>${e.summary?`<p>${esc(stripMd(e.summary))}</p>`:''}${chips?`<div class="chips">${chips}</div>`:''}</div></li>`}
function renderTimeline(){const filtered=data.entries.filter(e=>(!kind||e.kind===kind)&&(!query||[e.title,e.summary,...(e.tags||[])].join(' ').toLowerCase().includes(query.toLowerCase()))).slice(0,30);document.getElementById('timeline').innerHTML=filtered.length?filtered.map(eventHTML).join(''):'<li class="empty">No matching research entries.</li>'}
function reviewHTML(r,i){const title=r.context||stripMd(r.response).split('\n')[0]||'Advisor review';return `<div class="review" tabindex="0"><div class="review-head"><div class="review-title">${esc(title.slice(0,110))}</div><div class="review-meta">${short(r.time)} · ${esc(r.model)}</div></div><div class="review-body">${esc(r.response||r.error||'No response captured.')}</div></div>`}
function render(){const latest=data.entries[0],synthetic=datasetResult('synthetic'),real=datasetResult('real');document.getElementById('updated').textContent='Updated '+date(data.generated);document.getElementById('content').innerHTML=`<section class="objective"><div class="eyebrow">Current objective</div><h2>${esc(data.goal?.objective||'No research objective has been recorded.')}</h2><div class="objective-foot"><span class="status ${esc(data.goal?.status||'')}">${esc(data.goal?.status||'unset')}</span><span>${data.goal?.updated?'Changed '+date(data.goal.updated):''}</span></div></section><div class="layout"><div class="main"><div class="dataset-grid">${datasetBlock('synthetic',synthetic)}${datasetBlock('real',real)}</div><section class="panel"><div class="panel-head"><h3>Metric trajectory</h3><div class="legend"><span style="--color:var(--cyan)">AUC</span><span style="--color:var(--red)">False positive</span><span style="--color:var(--amber)">False negative</span></div></div><div id="chart"></div></section><section class="panel"><div class="panel-head"><h3>Research log</h3><div class="filters"><select id="kind"><option value="">All evidence</option>${[...new Set(data.entries.map(e=>e.kind))].sort().map(k=>`<option>${esc(k)}</option>`).join('')}</select><input id="search" type="search" placeholder="Search findings…" aria-label="Search research log"></div></div><ol class="timeline" id="timeline"></ol></section></div><aside class="side"><section class="panel"><div class="section-label">Latest conclusion</div><div class="verdict" style="margin-top:16px"><strong>${esc(latest?.title||'No conclusion yet')}</strong>${esc(stripMd(latest?.summary||''))}</div></section><section class="panel"><div class="panel-head"><h3>Advisor notes</h3><span class="kind">${data.reviews.length}</span></div>${data.reviews.slice(0,5).map(reviewHTML).join('')||'<div class="empty">No advisor reviews logged.</div>'}</section></aside></div>`;renderChart();renderTimeline();document.getElementById('kind').onchange=e=>{kind=e.target.value;renderTimeline()};document.getElementById('search').oninput=e=>{query=e.target.value;renderTimeline()};document.querySelectorAll('.review').forEach(el=>{const toggle=()=>el.classList.toggle('open');el.onclick=toggle;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}})}
async function load(){try{const r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();render()}catch(e){document.getElementById('content').innerHTML=`<div class="error"><strong>Dashboard unavailable</strong><br>${esc(e.message)}</div>`}}
document.getElementById('refresh').onclick=load;load();setInterval(load,30000);
</script>
</body></html>
