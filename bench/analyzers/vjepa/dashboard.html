<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-JEPA training</title>
<style>
:root{color-scheme:dark;--bg:#101217;--panel:#191d25;--line:#2b3240;--text:#edf1f7;--dim:#929baa;--blue:#72a7ff;--green:#50c878;--red:#ff6b72;--amber:#e5b85c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{font-size:24px;margin:0}.muted{color:var(--dim)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim);margin-right:7px}.dot.live{background:var(--green);box-shadow:0 0 10px var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.value{font-size:27px;font-weight:700;margin-top:5px}.label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.wide{grid-column:span 2}.bar{height:10px;background:#252b36;border-radius:8px;overflow:hidden;margin:13px 0 7px}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}.panels{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}h2{font-size:15px;margin:0 0 13px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th{text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase}td,th{padding:8px;border-bottom:1px solid var(--line)}td.good{color:var(--green)}td.bad{color:var(--red)}.score{display:flex;height:135px;align-items:end;gap:3px;margin-top:12px}.score i{flex:1;min-width:3px;background:var(--blue);opacity:.85;border-radius:2px 2px 0 0}.error{color:var(--red);padding:18px;border:1px solid #552b30;border-radius:8px}@media(max-width:760px){.grid,.panels{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.wrap{padding:18px}}
</style></head><body><div class="wrap"><header><div><h1>V-JEPA 2.1 training</h1><div class="muted">RTX training host · updates every 3 seconds</div></div><div id="connection"><span class="dot"></span>Connecting</div></header><div id="app"></div></div>
<script>
const pct=n=>n==null?'—':(100*n).toFixed(1)+'%'; const num=n=>n==null?'—':Number(n).toFixed(3);
const duration=s=>{if(s==null)return'—';s=Math.max(0,s);return s<60?s.toFixed(0)+'s':Math.floor(s/60)+'m '+Math.floor(s%60)+'s'};
function card(label,value,cls=''){return `<div class="card ${cls}"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function render(d){const p=d.progress||{}, done=p.completed||0,total=p.total||0, ratio=total?done/total:0, elapsed=p.elapsed_s||(p.started_unix?Date.now()/1000-p.started_unix:null), eta=done&&done<total?elapsed*(total-done)/done:null,m=p.metrics||p.interim||{},gpu=d.gpu||{};document.getElementById('connection').innerHTML=`<span class="dot live"></span>${p.state||'idle'} · ${new Date(d.time_unix*1000).toLocaleTimeString()}`;let html=`<div class="grid">${card('Phase',p.phase||'Waiting')}${card('Progress',total?done+' / '+total:'—')}${card('Elapsed',duration(elapsed))}${card('ETA',duration(eta))}<div class="card wide"><div class="label">Run progress</div><div class="bar"><i style="width:${ratio*100}%"></i></div><div class="muted">${pct(ratio)}${p.current_case?' · '+p.current_case:''}</div></div>${card('GPU',gpu.util==null?'—':gpu.util.toFixed(0)+'%')}${card('VRAM',gpu.memory_used_mb==null?'—':(gpu.memory_used_mb/1024).toFixed(1)+' / '+(gpu.memory_total_mb/1024).toFixed(1)+' GB')}</div>`;html+=`<div class="panels"><div class="panel"><h2>Live fold scores</h2><div class="score">${(p.history||[]).map(x=>`<i title="${x.case}: ${x.score}" style="height:${Math.max(2,x.score*100)}%;background:${x.label?'var(--red)':'var(--green)'}"></i>`).join('')}</div><div class="muted">Red = contact · green = no contact · height = predicted contact probability</div></div><div class="panel"><h2>Current metrics</h2><table><tr><td>AUC</td><td>${num(m.auc)}</td></tr><tr><td>Missed contacts</td><td class="${m.missed||m.contact_missed?'bad':'good'}">${m.missed??m.contact_missed??'—'} / ${m.positives??'—'}</td></tr><tr><td>False alerts</td><td class="${m.phantoms||m.contact_phantom?'bad':'good'}">${m.phantoms??m.contact_phantom??'—'} / ${m.negatives??'—'}</td></tr><tr><td>Localization</td><td>${m.loc_hits??'—'}</td></tr></table></div></div>`;html+=`<div class="panel" style="margin-top:12px"><h2>Completed experiments</h2><table><thead><tr><th>Head</th><th>AUC</th><th>Missed</th><th>False alerts</th><th>Sampling</th><th>Result</th></tr></thead><tbody>${(d.results||[]).map(r=>`<tr><td>${r.head||'—'}</td><td>${num(r.auc)}</td><td>${r.missed}/${r.positives}</td><td>${r.phantoms}/${r.negatives}</td><td>${r.sampling.fps||'—'} fps · ${r.sampling.frames||'—'}f</td><td class="muted">${r.file}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No completed experiments yet</td></tr>'}</tbody></table></div>`;document.getElementById('app').innerHTML=html}
async function poll(){try{const r=await fetch('/api/status',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);render(d)}catch(e){document.getElementById('connection').innerHTML='<span class="dot"></span>Disconnected';document.getElementById('app').innerHTML=`<div class="error">${e.message}</div>`}}poll();setInterval(poll,3000);
</script></body></html>
