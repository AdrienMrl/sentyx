<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESLCAM // DEBUG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c0a;
  --panel: #101410;
  --panel-edge: #1d241d;
  --ink: #b8c4b8;
  --ink-dim: #5c685c;
  --phosphor: #53d769;
  --phosphor-dim: #2a6b37;
  --amber: #e8b339;
  --red: #e63e2e;
  --red-dim: #7a2018;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: "Chakra Petch", var(--mono);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
}
/* faint scanlines + vignette */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, transparent 60%, rgba(0,0,0,.45));
}

header {
  display: flex; align-items: baseline; gap: 16px;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--panel-edge);
  background: linear-gradient(180deg, #0d100d, var(--bg));
}
header h1 {
  font-family: var(--display);
  font-size: 20px; letter-spacing: .12em; color: #e6ede6;
}
header h1 .slash { color: var(--red); }
.livedot {
  display: inline-flex; align-items: center; gap: 7px;
  color: var(--phosphor); font-size: 11px; letter-spacing: .2em;
}
.livedot i {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--phosphor); box-shadow: 0 0 8px var(--phosphor);
  animation: pulse 1.6s ease-in-out infinite;
}
.livedot.paused { color: var(--amber); }
.livedot.paused i { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: none; }
.livedot.err { color: var(--red); }
.livedot.err i { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }
@keyframes pulse { 50% { opacity: .25; } }
header .spacer { flex: 1; }
header .meta { color: var(--ink-dim); font-size: 11px; }

main {
  display: grid; gap: 14px;
  grid-template-columns: 340px 1fr;
  grid-template-rows: auto 1fr;
  grid-template-areas: "status tree" "actions tree" "log log";
  padding: 14px 20px 20px;
  height: calc(100% - 55px);
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-areas: "status" "actions" "tree" "log"; } }

section {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 4px;
  display: flex; flex-direction: column;
  min-height: 0;
}
section > h2 {
  font-family: var(--display);
  font-size: 11px; letter-spacing: .25em; font-weight: 600;
  color: var(--ink-dim);
  padding: 8px 12px;
  border-bottom: 1px solid var(--panel-edge);
  display: flex; align-items: center; gap: 8px;
}
section > h2::before { content: "▮"; color: var(--phosphor-dim); font-size: 9px; }
.pad { padding: 12px; overflow: auto; }

#status-card { grid-area: status; }
#actions-card { grid-area: actions; }
#tree-card { grid-area: tree; min-height: 200px; }
#log-card { grid-area: log; height: 200px; }

/* status */
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
dt { color: var(--ink-dim); }
dd { color: var(--ink); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill {
  display: inline-block; padding: 0 8px; border-radius: 3px;
  font-size: 11px; letter-spacing: .1em;
}
.pill.ok { color: var(--phosphor); border: 1px solid var(--phosphor-dim); }
.pill.warn { color: var(--amber); border: 1px solid #6b5418; }
.pill.bad { color: var(--red); border: 1px solid var(--red-dim); }

/* actions */
.action-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
button {
  font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
  background: #161c16; color: var(--ink);
  border: 1px solid #2a352a; border-radius: 3px;
  padding: 6px 12px; cursor: pointer;
  transition: border-color .12s, color .12s, box-shadow .12s;
}
button:hover { border-color: var(--phosphor-dim); color: #dfe8df; }
button:active { transform: translateY(1px); }
button.primary {
  color: #ffb0a8; border-color: var(--red-dim);
  background: linear-gradient(180deg, #1c100e, #150c0a);
}
button.primary:hover { border-color: var(--red); color: #ffd0cb; box-shadow: 0 0 12px rgba(230,62,46,.25); }
button:disabled { opacity: .4; cursor: not-allowed; }
input[type=number] {
  font-family: var(--mono); font-size: 12px;
  background: #0c0f0c; color: var(--phosphor);
  border: 1px solid #2a352a; border-radius: 3px;
  padding: 5px 8px; width: 84px;
}
label { color: var(--ink-dim); font-size: 11px; }
.hint { color: var(--ink-dim); font-size: 11px; margin: 2px 0 12px; }
.divider { border-top: 1px dashed var(--panel-edge); margin: 12px 0; }

/* tree */
#tree { font-size: 12.5px; white-space: pre; }
.t-row { display: flex; gap: 10px; padding: 0 2px; border-radius: 2px; }
.t-row:hover { background: #151b15; }
.t-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.t-dir { color: #8fd6ff; }
.t-file { color: var(--ink); }
.t-size { color: var(--ink-dim); }
.t-badge { font-size: 10px; letter-spacing: .1em; padding: 0 5px; border-radius: 2px; align-self: center; }
.t-badge.writing { color: var(--amber); border: 1px solid #6b5418; animation: pulse 1.2s infinite; }
.t-badge.torn { color: var(--red); border: 1px solid var(--red-dim); }
.t-row.fresh { animation: freshFlash 2.4s ease-out; }
@keyframes freshFlash { 0% { background: rgba(83,215,105,.35); } 100% { background: transparent; } }
.t-guide { color: #2a352a; }

/* log */
#log { font-size: 12px; }
.log-line { display: flex; gap: 12px; }
.log-time { color: var(--ink-dim); flex-shrink: 0; }
.log-tag { flex-shrink: 0; width: 70px; }
.log-tag.add { color: var(--phosphor); }
.log-tag.grow { color: var(--amber); }
.log-tag.del { color: var(--red); }
.log-tag.act { color: #8fd6ff; }
.log-tag.err { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>TESLCAM<span class="slash">//</span>DEBUG</h1>
  <span class="livedot" id="livedot"><i></i><span id="livelabel">LIVE</span></span>
  <span class="spacer"></span>
  <span class="meta" id="meta-paths"></span>
  <button id="pauseBtn">PAUSE</button>
</header>

<main>
  <section id="status-card">
    <h2>VOLUME &mdash; OUT-OF-BAND READ</h2>
    <div class="pad"><dl id="status">loading&hellip;</dl></div>
  </section>

  <section id="actions-card">
    <h2>FAKE TESLA &mdash; VIA MOUNT</h2>
    <div class="pad">
      <div class="action-row">
        <button class="primary" id="sentryBtn">⏺ SENTRY EVENT</button>
        <label>size/cam <input type="number" id="sentryKB" value="512" min="1"> KB</label>
      </div>
      <p class="hint">writes SentryClips/&lt;now&gt;/ &mdash; 4 cameras + event.json</p>
      <div class="divider"></div>
      <div class="action-row">
        <button id="streamStartBtn">▶ START CLIP</button>
        <button id="streamAppendBtn" disabled>+ APPEND</button>
        <label><input type="number" id="appendKB" value="256" min="1"> KB</label>
        <button id="streamFinishBtn" disabled>■ FINISH</button>
      </div>
      <p class="hint" id="streamHint">no clip in progress</p>
      <div class="divider"></div>
      <div class="action-row">
        <button id="syncBtn">⟳ SYNC()</button>
        <span class="hint" style="margin:0">flush page cache to backing image</span>
      </div>
    </div>
  </section>

  <section id="tree-card">
    <h2>FILESYSTEM &mdash; AS PARSED BY OUR READER</h2>
    <div class="pad" id="tree">loading&hellip;</div>
  </section>

  <section id="log-card">
    <h2>EVENT LOG &mdash; POLL DIFF</h2>
    <div class="pad" id="log"></div>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmtBytes = n => n >= 1048576 ? (n/1048576).toFixed(1)+" MB" : n >= 1024 ? (n/1024).toFixed(0)+" KB" : n+" B";
const now = () => new Date().toTimeString().slice(0,8);

let paused = false, pollErr = false, streamId = null;
let prevIndex = null;      // path -> {size, validSize}
let freshPaths = new Set(); // paths to flash on next render

function logLine(tag, cls, msg) {
  const div = document.createElement("div");
  div.className = "log-line";
  div.innerHTML = `<span class="log-time">${now()}</span><span class="log-tag ${cls}">${tag}</span><span>${msg}</span>`;
  const log = $("log");
  log.prepend(div);
  while (log.childElementCount > 200) log.lastChild.remove();
}

async function api(path, body) {
  const opts = body ? {method: "POST", body: JSON.stringify(body)} : {};
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function act(desc, path, body) {
  try {
    const data = await api(path, body);
    logLine("ACTION", "act", `${desc} → ${JSON.stringify(data)}`);
    poll(); // reflect immediately
    return data;
  } catch (e) {
    logLine("ERROR", "err", `${desc}: ${e.message}`);
    throw e;
  }
}

// ---- status ----
async function pollStatus() {
  const s = await api("/api/status");
  $("meta-paths").textContent = `${s.imagePath} ⇢ ${s.mountPath}`;
  $("status").innerHTML = `
    <dt>serial</dt><dd>${s.volumeSerial}</dd>
    <dt>image</dt><dd>${fmtBytes(s.imageSizeBytes)}</dd>
    <dt>sector</dt><dd>${s.bytesPerSector} B</dd>
    <dt>cluster</dt><dd>${fmtBytes(s.clusterSize)} × ${s.clusterCount}</dd>
    <dt>FAT offset</dt><dd>sector ${s.fatOffset}</dd>
    <dt>root dir</dt><dd>cluster ${s.rootDirCluster}</dd>
    <dt>dirty bit</dt><dd>${s.dirty
      ? '<span class="pill warn">DIRTY (mounted)</span>'
      : '<span class="pill ok">CLEAN</span>'}</dd>`;
}

// ---- tree ----
function indexTree(nodes, base, out) {
  for (const n of nodes) {
    const p = base + "/" + n.name;
    out.set(p, {size: n.size, validSize: n.validSize, isDir: n.isDir});
    if (n.children) indexTree(n.children, p, out);
  }
  return out;
}

function renderTree(nodes, base, prefix) {
  let html = "";
  nodes.forEach((n, i) => {
    const last = i === nodes.length - 1;
    const p = base + "/" + n.name;
    const badges =
      (!n.checksumOK ? '<span class="t-badge torn">TORN</span>' : "") +
      (!n.isDir && n.validSize < n.size ? '<span class="t-badge writing">WRITING</span>' : "");
    const fresh = freshPaths.has(p) ? " fresh" : "";
    const nameCls = n.isDir ? "t-dir" : "t-file";
    const size = n.isDir ? "" : fmtBytes(n.size) + (n.validSize < n.size ? ` <span class="t-size">(${fmtBytes(n.validSize)} valid)</span>` : "");
    html += `<div class="t-row${fresh}"><span class="t-name"><span class="t-guide">${prefix}${last ? "└─" : "├─"}</span> <span class="${nameCls}">${n.name}${n.isDir ? "/" : ""}</span></span>${badges}<span class="t-size">${size}</span></div>`;
    if (n.children) html += renderTree(n.children, p, prefix + (last ? "   " : "│  "));
    if (n.error) html += `<div class="t-row"><span class="t-name"><span class="t-guide">${prefix}   </span> <span class="t-badge torn">READ ERR</span> <span class="t-size">${n.error}</span></span></div>`;
  });
  return html;
}

async function pollTree() {
  const root = await api("/api/tree");
  const idx = indexTree(root.children || [], "", new Map());

  freshPaths = new Set();
  if (prevIndex) {
    for (const [p, n] of idx) {
      const old = prevIndex.get(p);
      if (!old) {
        freshPaths.add(p);
        logLine("NEW", "add", p + (n.isDir ? "/" : ` (${fmtBytes(n.size)})`));
      } else if (!n.isDir && (n.size !== old.size || n.validSize !== old.validSize)) {
        logLine("GROW", "grow", `${p} ${fmtBytes(old.validSize)} → ${fmtBytes(n.validSize)} valid of ${fmtBytes(n.size)}`);
      }
    }
    for (const p of prevIndex.keys()) {
      if (!idx.has(p)) logLine("GONE", "del", p);
    }
  }
  prevIndex = idx;
  $("tree").innerHTML = renderTree(root.children || [], "", "") || '<span class="t-size">(empty volume)</span>';
}

async function poll() {
  if (paused) return;
  try {
    await Promise.all([pollStatus(), pollTree()]);
    if (pollErr) { pollErr = false; setLive(); }
  } catch (e) {
    if (!pollErr) { pollErr = true; logLine("ERROR", "err", "poll: " + e.message); setLive(); }
  }
}

function setLive() {
  const dot = $("livedot");
  dot.className = "livedot" + (paused ? " paused" : pollErr ? " err" : "");
  $("livelabel").textContent = paused ? "PAUSED" : pollErr ? "NO SIGNAL" : "LIVE";
}

// ---- wiring ----
$("pauseBtn").onclick = () => {
  paused = !paused;
  $("pauseBtn").textContent = paused ? "RESUME" : "PAUSE";
  setLive();
  if (!paused) poll();
};
$("sentryBtn").onclick = () =>
  act("sentry-event", "/api/actions/sentry-event", {sizeKBPerCamera: +$("sentryKB").value});
$("streamStartBtn").onclick = async () => {
  const d = await act("stream/start", "/api/actions/stream/start", {camera: "front"});
  streamId = d.id;
  $("streamHint").textContent = "writing " + d.path;
  $("streamAppendBtn").disabled = $("streamFinishBtn").disabled = false;
  $("streamStartBtn").disabled = true;
};
$("streamAppendBtn").onclick = () =>
  act("stream/append", "/api/actions/stream/append", {id: streamId, sizeKB: +$("appendKB").value});
$("streamFinishBtn").onclick = async () => {
  await act("stream/finish", "/api/actions/stream/finish", {id: streamId});
  streamId = null;
  $("streamHint").textContent = "no clip in progress";
  $("streamAppendBtn").disabled = $("streamFinishBtn").disabled = true;
  $("streamStartBtn").disabled = false;
};
$("syncBtn").onclick = () => act("sync", "/api/actions/sync", {});

setLive();
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
